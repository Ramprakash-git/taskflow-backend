name: Taskflow backend CD

on:
    workflow_run:
        workflows: ["Taskflow backend CI"]
        types:
            - completed

permissions:
    contents: read
    id-token: write
    
jobs:
  on-success:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' &&  github.event.workflow_run.head_branch == 'master' }}
    steps:
        - name: Checkout code
          uses: actions/checkout@v7
          with:
            repository: Ramprakash-git/taskflow-kubernetes
            path: k8s
        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v6.3.0
          with:
            role-to-assume: ${{ vars.AWS_ROLE_ARN_CD }}
            aws-region: ${{ vars.AWS_REGION }}
        - name: Update Kubectl context
          run: |
            aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}
        - name: Update Deployment Image
          env:
            IMAGE_URI: ${{ vars.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ github.event.workflow_run.head_sha }}
          run: |
            sed -i "s|<image>|${IMAGE_URI}|g" k8s/deployment.yaml
        - name: Deploy to EKS
          run: |
            kubectl apply -f k8s/deployment.yaml
        - name: Verify Deployment
          run: |
            kubectl rollout status deployment/taskflow-backend -n taskflow --timeout=180s


